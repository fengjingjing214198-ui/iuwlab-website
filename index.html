  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Restore a route encoded by public/404.html before React Router starts.
      (function (location) {
        if (location.search[1] === "/") {
          const parts = location.search
            .slice(1)
            .split("&")
            .map((part) => part.replace(/~and~/g, "&"));
          window.history.replaceState(
            null,
            "",
            location.pathname.slice(0, -1) +
              parts[0] +
              (parts.length > 1 ? `?${parts.slice(1).join("&")}` : "") +
              location.hash,
          );
        }
      })(window.location);
    </script>
